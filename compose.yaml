services:
  channel5:
    build:
      context: .
      args:
        CHANNEL5_BASE_ID: ${CHANNEL5_BASE_ID:-untracked}
        CHANNEL5_SOURCE_DIGEST: ${CHANNEL5_SOURCE_DIGEST:-untracked}
    image: channel5-stream:local
    container_name: channel5-stream
    init: true
    restart: unless-stopped
    ports:
      - "${CHANNEL5_HOST_BIND:-127.0.0.1}:${CHANNEL5_PORT:-1996}:1996"
    environment:
      CHANNEL5_PUBLIC_URL: ${CHANNEL5_PUBLIC_URL:-http://localhost:1996}
      CHANNEL5_METADATA_URL: ${CHANNEL5_METADATA_URL:-}
      CHANNEL5_DAI_EVENT: ${CHANNEL5_DAI_EVENT:-}
    volumes:
      - channel5-state:/state
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1996/health', timeout=5).read()"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  channel5-state:
